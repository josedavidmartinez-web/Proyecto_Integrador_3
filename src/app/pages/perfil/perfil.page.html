<ion-content class="ion-padding">
  <div class="perfil-container">
    <h2 class="perfil-titulo">Mi Perfil</h2>

    <!-- AVATAR Y NOMBRE -->
    <div class="avatar-seccion">
      <div class="avatar-circle">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <h3 class="usuario-nombre">Cristian Gonzales</h3>
      <span class="btn-editar">editar perfil</span>
    </div>

    <!-- DATOS PERSONALES -->
    <div class="info-block">
      <div class="row-flex">
        <span class="label-bold">Datos personales</span>
        <span class="label-bold">Teléfono</span>
      </div>
    </div>

    <!-- HISTORIAL MÉDICO -->
    <div class="info-block">
      <h4 class="block-title">Historial médico</h4>
      <div class="item-line"><span>Alergias:</span></div>
      <div class="item-line"><span>Condiciones:</span></div>
      <div class="item-line"><span>Última cita:</span></div>
      <div class="item-line"><span>Próxima cita:</span></div>
    </div>

    <!-- CONFIGURACIÓN -->
    <div class="info-block">
      <h4 class="block-title">Configuración</h4>
      <div class="item-line"><span>Notificaciones</span></div>
      <div class="item-line"><span>Recordatorios de medicación</span></div>
      <div class="item-line"><span>Idioma</span></div>
    </div>

    <!-- BOTÓN CERRAR SESIÓN -->
    <div class="ion-text-center ion-margin-top">
      <button type="button" class="btn-cerrar-sesion" (click)="cerrarSesion()">
        Cerrar Sesión
      </button>
    </div>
  </div>
</ion-content>

<!-- NAVEGACIÓN INFERIOR (TABS) -->
<ion-footer>
  <ion-toolbar class="footer-toolbar">
    <div class="tabs-bar">
      <ion-button fill="clear" class="tab-btn" (click)="irA('/home')">
        <ion-icon name="home-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" class="tab-btn" (click)="irA('/agendar-cita')">
        <ion-icon name="calendar-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" class="tab-btn" (click)="irA('/categorias')">
        <ion-icon name="grid-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" class="tab-btn" (click)="irA('/carrito')">
        <ion-icon name="cart-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" class="tab-btn active" (click)="irA('/perfil')">
        <ion-icon name="person-sharp"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
