<ion-content class="ion-padding">
  <div class="back-header" (click)="regresar()">
    <ion-icon name="arrow-back-outline"></ion-icon>
    <span>Agendar Cita</span>
  </div>

  <div class="form-agendar">
    <div class="input-group">
      <label>Nombre Completo</label>
      <input type="text" placeholder="Nombre y Apellidos" class="custom-input" />
    </div>

    <div class="input-group">
      <label>Edad</label>
      <input type="number" class="custom-input" />
    </div>

    <div class="input-group">
      <label>Número de Teléfono</label>
      <input type="tel" placeholder="Número telefónico" class="custom-input" />
    </div>

    <div class="input-group">
      <label>Correo Electrónico</label>
      <input type="email" placeholder="Correo Electrónico" class="custom-input" />
    </div>

    <div class="input-group">
      <label>Identificación estatal</label>
      <input type="text" placeholder="CURP" class="custom-input" />
    </div>

    <div class="input-group">
      <label>Motivo de consulta</label>
      <textarea rows="3" placeholder="Síntomas de cliente" class="custom-input"></textarea>
    </div>

    <div class="actions-row">
      <button type="button" class="btn-confirmar" (click)="confirmarCita()">
        Confirmar Cita
      </button>
      <button type="button" class="btn-cancelar" (click)="regresar()">
        Cancelar Cita
      </button>
    </div>
  </div>
</ion-content>

<!-- NAVEGACIÓN INFERIOR (TABS) -->
<ion-footer class="custom-footer">
  <div class="tabs-bar">
    <button type="button" class="tab-btn" (click)="irA('/home')">
      <ion-icon name="home-outline"></ion-icon>
    </button>
    <button type="button" class="tab-btn active" (click)="irA('/agendar-cita')">
      <ion-icon name="calendar-outline"></ion-icon>
    </button>
    <button type="button" class="tab-btn" (click)="irA('/categorias')">
      <ion-icon name="grid-outline"></ion-icon>
    </button>
    <button type="button" class="tab-btn" (click)="irA('/carrito')">
      <ion-icon name="cart-outline"></ion-icon>
    </button>
    <button type="button" class="tab-btn" (click)="irA('/perfil')">
      <ion-icon name="person-outline"></ion-icon>
    </button>
  </div>
</ion-footer>
