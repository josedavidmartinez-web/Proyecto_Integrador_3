<ion-content class="ion-padding">
  <!-- ENCABEZADO PARA REGRESAR -->
  <div class="back-header" (click)="regresar()">
    <ion-icon name="arrow-back-outline"></ion-icon>
    <h2>{{ detalleActual.titulo }}</h2>
  </div>

  <!-- TARJETA DE DETALLE DINÁMICO -->
  <div class="detalle-card">
    <p class="intro-texto">{{ detalleActual.descripcion }}</p>

    <div class="seccion-info">
      <h3>Detalles y características:</h3>
      <ul>
        @for (punto of detalleActual.puntosClave; track $index) {
          <li>{{ punto }}</li>
        }
      </ul>
    </div>

    @if (detalleActual.precio) {
      <div class="precio-box">
        <span>Precio estimado:</span>
        <p class="monto">{{ detalleActual.precio }} <small>IVA incluido</small></p>
      </div>
    }

    <button type="button" class="btn-agendar" (click)="agendarCita()">
      Agendar Cita
    </button>
  </div>
</ion-content>

<!-- NAVEGACIÓN INFERIOR (TABS) -->
<ion-footer>
  <ion-toolbar class="footer-toolbar">
    <div class="tabs-bar">
      <ion-button fill="clear" class="tab-btn" [class.active]="pantallaActual === 'home'" (click)="irA('/home')">
        <ion-icon name="home-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" class="tab-btn" [class.active]="pantallaActual === 'agendar'" (click)="irA('/agendar-cita')">
        <ion-icon name="calendar-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" class="tab-btn" [class.active]="pantallaActual === 'categorias'" (click)="irA('/categorias')">
        <ion-icon name="grid-sharp"></ion-icon>
      </ion-button>
      <ion-button fill="clear" class="tab-btn" [class.active]="pantallaActual === 'carrito'" (click)="irA('/carrito')">
        <ion-icon name="cart-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" class="tab-btn" [class.active]="pantallaActual === 'perfil'" (click)="irA('/perfil')">
        <ion-icon name="person-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
