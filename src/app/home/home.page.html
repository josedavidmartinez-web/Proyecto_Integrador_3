<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Servicios Médicos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="irA('carrito')">
        <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar color="primary">
    <ion-searchbar placeholder="Buscar estudio o especialidad..."></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-button expand="block" fill="outline" (click)="irA('categorias')">
          <ion-icon slot="start" name="grid-outline"></ion-icon>
          Categorías
        </ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button expand="block" fill="outline" (click)="irA('agendar-cita')">
          <ion-icon slot="start" name="calendar-number-outline"></ion-icon>
          Agendar Cita
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <h2 class="ion-margin-top">Estudios Disponibles</h2>

  @for (estudio of listaEstudios; track estudio.id) {
    <ion-card class="ion-margin-bottom">
      <ion-card-header>
        <ion-card-title>{{ estudio.titulo }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <p>{{ estudio.descripcion }}</p>
        <p><strong>Beneficio:</strong> {{ estudio.beneficio }}</p>
        <p class="precio">${{ estudio.precio }} MXN</p>

        <ion-button expand="block" class="ion-margin-top" (click)="verDetalleEstudio(estudio)">
          Ver Detalle
        </ion-button>
      </ion-card-content>
    </ion-card>
  }
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-grid>
      <ion-row class="ion-text-center">
        <ion-col>
          <ion-button fill="clear" size="small" (click)="irA('home')">
            <ion-icon name="home-sharp"></ion-icon>
          </ion-button>
        </ion-col>
        <ion-col>
          <ion-button fill="clear" size="small" (click)="irA('categorias')">
            <ion-icon name="grid-outline"></ion-icon>
          </ion-button>
        </ion-col>
        <ion-col>
          <ion-button fill="clear" size="small" (click)="irA('perfil')">
            <ion-icon name="person-circle-outline"></ion-icon>
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
